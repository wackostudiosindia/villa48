  <style>
    /*
      The logo intro. Inlined so it paints at once. The page underneath is already in the HTML (pre-rendered),
      so the intro lifts by itself ~1.7 s after the page starts, as soon as the stylesheet is in, without
      waiting for any JavaScript. Tapping it, a key or the wheel lifts it early.
    */
    #intro {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #f6f2e7; touch-action: none; overscroll-behavior: contain;
      background: radial-gradient(60% 50% at 50% 42%, rgba(220,192,138,.16), transparent 70%),
        radial-gradient(120% 90% at 50% 40%, #1c4a33 0%, #0b2a1c 55%, #04130b 100%);
      transition: transform .9s cubic-bezier(.77,0,.18,1);
      animation: inFail 0s 6s forwards;
    }
    html.lift #intro { transform: translateY(-100%); }
    #intro .c { display: grid; justify-items: center; gap: 24px; transition: transform .9s cubic-bezier(.77,0,.18,1), opacity .5s; }
    html.lift #intro .c { transform: translateY(-40px); opacity: 0; }
    #intro .mark { position: relative; width: min(30vw,132px); aspect-ratio: 520/685; animation: inMark .9s cubic-bezier(.2,.8,.2,1) .05s both; }
    #intro .mark img { position: relative; display: block; width: 100%; height: auto; }
    #intro .glow { position: absolute; inset: -60%; background: radial-gradient(circle, rgba(220,192,138,.28), transparent 60%); animation: inGlow 1.6s ease-out .2s both; }
    #intro .shine { position: absolute; inset: 0; overflow: hidden;
      -webkit-mask: url(%IMG:icon_light:280%) center/100% 100% no-repeat; mask: url(%IMG:icon_light:280%) center/100% 100% no-repeat; }
    #intro .shine::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 60%;
      background: linear-gradient(105deg, transparent, rgba(255,232,178,.95) 50%, transparent);
      animation: inShine .9s ease-in-out .65s both; }
    #intro .word { width: min(62vw,250px); height: auto; animation: inWord .8s cubic-bezier(.2,.8,.2,1) .45s both; }
    #intro .skip { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%);
      background: none; border: 0; color: rgba(246,242,231,.6); font: 600 10px/1 system-ui, sans-serif; letter-spacing: .24em;
      text-transform: uppercase; padding: 14px 18px; cursor: pointer; animation: inFade .6s ease .8s both; }
    /* below-the-fold sections skip layout even before the main stylesheet arrives */
    .defer-render { content-visibility: auto; contain-intrinsic-size: auto 1200px; }
    @keyframes inFail { to { visibility: hidden; } }
    @keyframes inMark { from { opacity: 0; transform: translateY(20px) scale(1.06); } to { opacity: 1; transform: none; } }
    @keyframes inGlow { 0% { opacity: 0; transform: scale(.6); } 40% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
    @keyframes inShine { from { transform: translateX(0); } to { transform: translateX(270%); } }
    @keyframes inWord { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {

  <script>
    (function () {
      var d = document.documentElement, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var MIN = rm ? 400 : 1700, lifted = false;
      if (!rm) d.classList.add('th'); // enables the scroll-in animations
      function lift() {
        if (lifted) return;
        lifted = true;
        d.classList.add('lift');
        d.classList.remove('intro');
        setTimeout(function () {
          var el = document.getElementById('intro');
          if (el) el.remove();
          dispatchEvent(new Event('v48:layout'));
        }, rm ? 30 : 950);
      }
      // Called when the main stylesheet has loaded: lift once the intro has had its moment.
      window.__v48 = { lift: lift, ready: function () { setTimeout(lift, Math.max(0, MIN - performance.now())); } };
      setTimeout(lift, 4500);
      addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#intro')) lift(); });
      addEventListener('keydown', function (e) { if (!lifted && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) lift(); });
      addEventListener('wheel', function (e) { if (lifted) return; e.preventDefault(); if (performance.now() > 1000) lift(); }, { passive: false });
    })();
