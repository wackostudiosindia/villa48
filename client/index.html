  <style>
    /* Critical styles for the logo intro, inlined so it paints before the main stylesheet and the app load. */
    #intro {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #f6f2e7; touch-action: none; overscroll-behavior: contain;
      background: radial-gradient(60% 50% at 50% 42%, rgba(220,192,138,.16), transparent 70%),
        radial-gradient(120% 90% at 50% 40%, #1c4a33 0%, #0b2a1c 55%, #04130b 100%);
      transition: transform 1.15s cubic-bezier(.77,0,.18,1);
      animation: inFail 0s 8s forwards;
    }
    #intro.out { transform: translateY(-100%); }
    #intro .c { display: grid; justify-items: center; gap: 26px; transition: transform 1.15s cubic-bezier(.77,0,.18,1), opacity .7s; }
    #intro.out .c { transform: translateY(-40px); opacity: 0; }
    #intro .mark { position: relative; width: min(30vw,132px); aspect-ratio: 520/685; animation: inMark 1.4s cubic-bezier(.2,.8,.2,1) .2s both; }
    #intro .mark img { position: relative; display: block; width: 100%; height: auto; }
    #intro .glow { position: absolute; inset: -60%; background: radial-gradient(circle, rgba(220,192,138,.28), transparent 60%); animation: inGlow 2.4s ease-out .5s both; }
    #intro .shine { position: absolute; inset: 0; overflow: hidden;
      -webkit-mask: url(%IMG:icon_light:280%) center/100% 100% no-repeat; mask: url(%IMG:icon_light:280%) center/100% 100% no-repeat; }
    #intro .shine::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 60%;
      background: linear-gradient(105deg, transparent, rgba(255,232,178,.95) 50%, transparent);
      transform: translateX(0); animation: inShine 1.5s ease-in-out 1.2s both; }
    #intro .word { width: min(62vw,250px); height: auto; animation: inWord 1.1s cubic-bezier(.2,.8,.2,1) 1s both; }
    #intro .skip { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom,0px)); transform: translateX(-50%);
      background: none; border: 0; color: rgba(246,242,231,.6); font: 600 10px/1 system-ui, sans-serif; letter-spacing: .24em;
      text-transform: uppercase; padding: 14px 18px; cursor: pointer; animation: inFade .8s ease 1.6s both; }
    @keyframes inFail { to { visibility: hidden; } }
    @keyframes inMark { from { opacity: 0; transform: translateY(24px) scale(1.08); } to { opacity: 1; transform: none; } }
    @keyframes inGlow { 0% { opacity: 0; transform: scale(.6); } 40% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
    @keyframes inShine { to { transform: translateX(270%); } }
    @keyframes inWord { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #intro, #intro .c, #intro .mark, #intro .glow, #intro .shine::after, #intro .word, #intro .skip { animation: none; transition: none; }
      #intro { animation: inFail 0s 8s forwards; }
    }
  </style>
